name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.1)。留空则用默认 v1.0.1。'
        required: false
        default: ''

jobs:
  build-win:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      # electron 二进制由 postinstall 下载；构建脚本白名单可能拦截，这里显式触发（幂等）
      - run: node node_modules/electron/install.js
      - run: pnpm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-win
          path: dist/*.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: node node_modules/electron/install.js
      - run: pnpm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-linux
          path: dist/*.AppImage
          if-no-files-found: error

  build-mac:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: node node_modules/electron/install.js
      - run: pnpm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-mac
          path: dist/*.dmg
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-win, build-linux, build-mac]
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || (inputs.tag || 'v1.0.1') }}
          name: ${{ github.event_name == 'push' && github.ref_name || (inputs.tag || 'v1.0.1') }}
          files: release-assets/**
          generate_release_notes: true
          fail_on_unmatched_files: true
