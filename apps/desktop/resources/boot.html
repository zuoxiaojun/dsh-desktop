<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>DSH Desktop</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg-1: #eef3fb;
        --bg-2: #e0e9f8;
        --fg: #1c2333;
        --sub: #6b7280;
        --track: #dbe3f0;
        --bar: #2f6fed;
        --tile-1: #ffffff;
        --tile-2: #e7eefb;
        --err: #d33;
        --shadow: rgba(31, 45, 80, 0.14);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-1: #16181f;
          --bg-2: #1c2230;
          --fg: #eceef3;
          --sub: #9aa1ad;
          --track: #33363f;
          --bar: #4f8cff;
          --tile-1: #ffffff;
          --tile-2: #dfe7f6;
          --err: #ff6b6b;
          --shadow: rgba(0, 0, 0, 0.45);
        }
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        -webkit-app-region: drag;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
        background: linear-gradient(160deg, var(--bg-1), var(--bg-2));
        color: var(--fg);
        user-select: none;
        overflow: hidden;
      }
      .card {
        width: 400px;
        text-align: center;
        padding: 30px 26px;
      }
      .logo {
        width: 104px;
        height: 104px;
        margin: 0 auto 20px;
        border-radius: 24px;
        background: linear-gradient(140deg, var(--tile-1), var(--tile-2));
        box-shadow: 0 12px 34px var(--shadow);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .logo img {
        width: 66px;
        height: 66px;
        display: block;
      }
      .title {
        font-size: 23px;
        font-weight: 700;
        letter-spacing: 0.3px;
      }
      .tagline {
        font-size: 13px;
        color: var(--sub);
        margin-top: 6px;
        margin-bottom: 24px;
      }
      .stage {
        font-size: 14px;
        font-weight: 500;
        min-height: 21px;
      }
      .bar {
        margin-top: 13px;
        height: 8px;
        border-radius: 5px;
        background: var(--track);
        overflow: hidden;
      }
      .bar > i {
        display: block;
        height: 100%;
        width: 0;
        background: var(--bar);
        border-radius: 5px;
        transition: width 0.2s ease;
      }
      .bar.indeterminate > i {
        width: 30%;
        animation: slide 1.2s ease-in-out infinite;
      }
      @keyframes slide {
        0% {
          margin-left: -30%;
        }
        100% {
          margin-left: 100%;
        }
      }
      .detail {
        font-size: 12px;
        color: var(--sub);
        margin-top: 11px;
        min-height: 17px;
        font-variant-numeric: tabular-nums;
      }
      .err {
        color: var(--err);
        margin-top: 12px;
        font-size: 13px;
        word-break: break-all;
      }
      .btn {
        -webkit-app-region: no-drag;
        margin-top: 18px;
        padding: 9px 30px;
        font-size: 14px;
        font-weight: 600;
        border: 0;
        border-radius: 8px;
        background: var(--bar);
        color: #fff;
        cursor: pointer;
      }
      .btn:hover {
        filter: brightness(1.06);
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo"><img src="icon.svg" alt="DSH" /></div>
      <div class="title" id="title">DSH Desktop</div>
      <div class="tagline">DeepSeek Harness 桌面客户端</div>
      <div class="stage" id="stage">正在初始化…</div>
      <div class="bar indeterminate" id="bar"><i></i></div>
      <div class="detail" id="detail"></div>
      <div class="err hidden" id="err"></div>
      <button class="btn hidden" id="retry">重试</button>
    </div>
    <script>
      const $ = (id) => document.getElementById(id);
      const bar = $("bar"),
        barFill = bar.querySelector("i");
      const stageEl = $("stage"),
        detailEl = $("detail"),
        errEl = $("err"),
        retryBtn = $("retry");
      window.dshBoot.onProgress((p) => {
        errEl.classList.add("hidden");
        retryBtn.classList.add("hidden");
        stageEl.textContent = p.detail || p.stage;
        if (typeof p.percent === "number") {
          bar.classList.remove("indeterminate");
          barFill.style.width = Math.max(0, Math.min(100, p.percent)) + "%";
        } else {
          bar.classList.add("indeterminate");
        }
        detailEl.textContent =
          typeof p.percent === "number" && p.totalBytes
            ? p.receivedBytes + " / " + p.totalBytes + " bytes"
            : "";
      });
      window.dshBoot.onError((e) => {
        bar.classList.remove("indeterminate");
        barFill.style.width = "0";
        stageEl.textContent = "初始化失败";
        errEl.textContent = e.message;
        errEl.classList.remove("hidden");
        retryBtn.classList.remove("hidden");
      });
      retryBtn.addEventListener("click", () => window.dshBoot.retry());
    </script>
  </body>
</html>
