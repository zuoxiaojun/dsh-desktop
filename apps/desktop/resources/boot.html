<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>DSH Desktop</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: var(--bg, #f6f7f9);
        color: var(--fg, #1c1e21);
        user-select: none;
      }
      @media (prefers-color-scheme: dark) {
        body {
          --bg: #1e1f24;
          --fg: #e8e9eb;
          --sub: #9a9da3;
          --track: #34363c;
          --bar: #4f8cff;
          --err: #ff6b6b;
        }
      }
      body {
        --sub: #6b6f76;
        --track: #e2e4e8;
        --bar: #2f6fed;
        --err: #d33;
      }
      .card {
        width: 420px;
        text-align: center;
      }
      .logo {
        width: 56px;
        height: 56px;
        margin: 0 auto 14px;
      }
      .title {
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 4px;
      }
      .stage {
        font-size: 12px;
        color: var(--sub);
        margin-bottom: 16px;
        min-height: 18px;
      }
      .bar {
        height: 6px;
        border-radius: 3px;
        background: var(--track);
        overflow: hidden;
      }
      .bar > i {
        display: block;
        height: 100%;
        width: 0;
        background: var(--bar);
        border-radius: 3px;
        transition: width 0.2s ease;
      }
      .bar.indeterminate > i {
        width: 30%;
        animation: slide 1.2s ease-in-out infinite;
      }
      @keyframes slide {
        0% {
          margin-left: -30%;
        }
        100% {
          margin-left: 100%;
        }
      }
      .detail {
        font-size: 11px;
        color: var(--sub);
        margin-top: 10px;
        min-height: 16px;
      }
      .err {
        color: var(--err);
        margin-top: 10px;
        font-size: 12px;
        word-break: break-all;
      }
      .btn {
        margin-top: 14px;
        padding: 7px 22px;
        font-size: 13px;
        border: 0;
        border-radius: 6px;
        background: var(--bar);
        color: #fff;
        cursor: pointer;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="14" fill="#2f6fed" />
        <path
          d="M20 22c0-4 3-7 7-7h10c4 0 7 3 7 7v8h-6v-7c0-1-1-2-2-2H28c-1 0-2 1-2 2v20c0 1 1 2 2 2h8c1 0 2-1 2-2v-7h6v8c0 4-3 7-7 7h-10c-4 0-7-3-7-7z"
          fill="#fff"
        />
      </svg>
      <div class="title" id="title">DSH Desktop</div>
      <div class="stage" id="stage">正在初始化…</div>
      <div class="bar indeterminate" id="bar"><i></i></div>
      <div class="detail" id="detail"></div>
      <div class="err hidden" id="err"></div>
      <button class="btn hidden" id="retry">重试</button>
    </div>
    <script>
      const $ = (id) => document.getElementById(id);
      const bar = $("bar"),
        barFill = bar.querySelector("i");
      const stageEl = $("stage"),
        detailEl = $("detail"),
        errEl = $("err"),
        retryBtn = $("retry");
      window.dshBoot.onProgress((p) => {
        errEl.classList.add("hidden");
        retryBtn.classList.add("hidden");
        stageEl.textContent = p.detail || p.stage;
        if (typeof p.percent === "number") {
          bar.classList.remove("indeterminate");
          barFill.style.width = Math.max(0, Math.min(100, p.percent)) + "%";
        } else {
          bar.classList.add("indeterminate");
        }
        detailEl.textContent =
          typeof p.percent === "number" && p.totalBytes
            ? p.receivedBytes + " / " + p.totalBytes + " bytes"
            : "";
      });
      window.dshBoot.onError((e) => {
        bar.classList.remove("indeterminate");
        barFill.style.width = "0";
        stageEl.textContent = "初始化失败";
        errEl.textContent = e.message;
        errEl.classList.remove("hidden");
        retryBtn.classList.remove("hidden");
      });
      retryBtn.addEventListener("click", () => window.dshBoot.retry());
    </script>
  </body>
</html>
